version: '3.8'

services:
  budgetwise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budgetwise_app
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
